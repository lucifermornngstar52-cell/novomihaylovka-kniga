<template class="tpl" data-i="1"><div class="tpl-left"><div class="chap-roman">I</div>
      <div class="chap-label">С чего началась эта книга</div>
      <h2>Учитель, который записал историю села</h2>
      <figure class="photo tilt-l"><img src="img/image13.jpg" alt="Плакат «Бессмертный полк»" loading="lazy"><figcaption>Плакат «Бессмертный полк»</figcaption></figure>
      <span class="page-num">— 1 —</span></div><div class="tpl-right"><p>В школе хранится рукописная книга. Её написал от руки <b>Пётр Александрович Кострица</b>.</p>
<p>Пётр Александрович родился в 1922 году. Он прошёл Великую Отечественную войну. Его портрет есть на плакате «Бессмертный полк». После войны он много лет преподавал историю в Новомихайловской школе.</p>
<p>Свою книгу о селе он писал синими чернилами, ровным наклонным почерком. Бумагу брал ту, что была под рукой: старые цветные бланки. Внизу каждого листа напечатано «Утверждено ... 196_ г.». Значит, книга писалась между 1960-ми годами и 1981 годом, когда автора не стало.</p>
<h3>Что удалось сделать</h3>
<p>Расшифрованы <b>3 страницы</b> рукописи о начале села. Из 310 слов прочитано <b>304</b>. Все факты сверены с газетами 2001–2010 годов, школьной презентацией и интернет-источниками.</p>
<div class="quote-hand">«Основатели нашего села приехали осенью.»<cite>из рукописи П.А. Кострицы</cite></div>
<figure class="photo"><img src="img/image14.jpg" alt="Первая страница о переселении" loading="lazy"><figcaption>Первая страница о переселении</figcaption></figure>
      <span class="page-num">— 2 —</span></div></template>
<template class="tpl" data-i="2"><div class="tpl-left"><div class="chap-roman">II</div>
      <div class="chap-label">Земля степи</div>
      <h2>Дорога в Северный Казахстан</h2>
      <p class="small-cap">Конец XIX века</p>
<p>В центральных губерниях Российской империи жило очень много крестьян. Земли на всех не хватало, семьи жили бедно.</p>
<p>13 июля 1889 года вышло Положение о добровольном переселении на казённые земли. После неурожая 1891–1892 годов крестьяне ещё сильнее захотели уехать на новые земли. Многие ехали охотно, «в надежде получить собственный клочок» земли.</p>
<p>На дорогу государство давало деньги в долг. Ссуды часто не хватало даже на дорогу. Железной дороги до Петропавловска ещё не было, часть пути ехали на телегах.</p>

<h3>Откуда ехали (по рукописи)</h3>

<h3>Об этом важно помнить</h3>
<p>Земля, куда ехали переселенцы, не была пустой. Здесь веками кочевали казахские аулы, здесь были их пастбища. Сначала крестьяне брали землю у казахов в аренду. Позже власть стала забирать пастбища и отдавать их переселенцам. Из-за этого появлялись споры.</p>
      <span class="page-num">— 4 —</span></div></template>
<template class="tpl" data-i="3"><div class="tpl-left"><div class="chap-roman">III</div>
      <div class="chap-label">Глава первая. Как всё начиналось</div>
      <h2>Весна 1895 года: 14 первых хозяев</h2>
      <p class="small-cap">1894 – 1895</p>
<p>Основатели села приехали осенью 1894 года. Построить дома до зимы они не успели и зимовали в селе Богомолово.</p>
<p>Ранней весной 1895 года на бугре между озёрами «Кас-Агач» и «Русское» появились первые поселенцы. Каждый хозяин получил 15 десятин земли. Это около 16 гектаров.</p>
<p>Строили всё вместе, артелью. Сначала рыли землянки, потом покупали скот и инструменты. Стены делали из самана, то есть из глины с соломой.</p>
      <span class="page-num">— 5 —</span></div><div class="tpl-right"><h3>Первые хозяева (по рукописи)</h3>
<p>Троцко Иван* · Чуб Григорий · Хименя Григорий* · Лысенко Павел · Кундер Евсей · Нагорный Фёдор · Бабич Василий · «и другие»</p>
<p><i>* фамилия в рукописи читается не совсем ясно</i></p>

<template class="tpl" data-i="4"><div class="tpl-left"><div class="chap-roman">IV</div>
      <div class="chap-label">Первые годы</div>
      <h2>Михайловское между двух озёр</h2>
      <p>Сначала село называлось Михайловское. Позже появилось название Новомихайловка.</p>
<p>Село стоит между озёрами Косагаш и Русское, в 50 км от районного центра Мамлютки. В рукописи озеро названо «Кас-Агач», а в интернете «Косагаш». Скорее всего, это одно и то же озеро, просто имя записали по-разному.</p>
<p>По-казахски «қос ағаш» значит «два дерева». Это предположение, точного подтверждения пока нет.</p>
<p>Кострица пишет, что ночью у землянок стояла «тревожная тишина». Рядом с собой клали ружьё, а у кого его не было, вилы или топор. По словам автора, у этих земель был ещё один хозяин, бай. Между переселенцами и казахами случались столкновения.</p>
<p>Рукопись рассказывает только о переселенцах. Взгляд казахских аулов в ней не показан. Земля была их пастбищем, поэтому споры возникали у обеих сторон. Сегодня в селе и в округе рядом живут люди разных народов, и эта история напоминает, как важно договариваться и уважать друг друга.</p>

<template class="tpl" data-i="5"><div class="tpl-left"><div class="chap-roman">V</div>

      <h2>Первая школа и церковь</h2>
      <p class="small-cap">1898 – 1974</p>
<p>Первую школу в селе открыли в 1898 году. В книге она описана так: «Деревянная, под железной кровлей, школа старенькая была».</p>
<p>В 1954 году построили новую школу, а в 1974 году — просторное здание, в котором школа работает и сейчас.</p>
<p>В 2008 году в селе построили новый храм. Хозяйство «Новомихайловское» во главе с директором Г.Г. Щеголевым помогало его возведению.</p>
      <span class="page-num">— 9 —</span></div><div class="tpl-right"><figure class="photo tilt-l"><img src="img/image31.jpg" alt="Старая деревянная школа" loading="lazy"><figcaption>«Деревянная, под железной кровлей, школа старенькая была»</figcaption></figure>
<figure class="photo tilt-r"><img src="img/image32.jpg" alt="Новая школа" loading="lazy"><figcaption>Новая школа</figcaption></figure>
<p>Школа стала центром жизни села. Здесь учились дети переселенцев, здесь же работал учителем Пётр Александрович Кострица.</p>
      <span class="page-num">— 10 —</span></div></template>
<template class="tpl" data-i="6"><div class="tpl-left"><div class="chap-roman">VI</div>

      <h2>Старое уходит, новое появляется</h2>
      <p>Старая церковь из брёвен сильно покосилась, крыша провалилась. Рядом с ней стоит новый кирпичный храм, красный, с голубыми куполами. Эти два здания будто разговаривают друг с другом: село помнит прошлое и строит будущее.</p>

      <p class="small-cap">Труд и урожаи</p>
<p>Земля степи требовала тяжёлого труда. С первых лет жители пахали, сеяли, собирали урожай. Хлеб стал главным богатством села.</p>

<p>С годами хозяйство выросло, появились современные комбайны и тракторы. На полях работали целые династии механизаторов.</p>

<script>
const templates = document.querySelectorAll('template.tpl');
const spreads = [];
templates.forEach(t => {
  const div = document.createElement('div');
  div.innerHTML = t.innerHTML;
  spreads.push({
    left: div.querySelector('.tpl-left').innerHTML,
    right: div.querySelector('.tpl-right').innerHTML
  });
});

const book = document.getElementById('book');
const halfLeft = document.getElementById('halfLeft');
const halfRight = document.getElementById('halfRight');
const scene = document.getElementById('scene');
const TOTAL = spreads.length - 1; // 17 разворотов
let cur = 0;
let busy = false;

function setSpread(i) {
  cur = i;
  halfLeft.innerHTML = spreads[i].left;
  halfRight.innerHTML = spreads[i].right;
  halfLeft.scrollTop = 0; halfRight.scrollTop = 0;
  book.classList.toggle('closed', i === 0);
  updateNav();
}

function updateNav() {
  document.getElementById('btnPrev').disabled = (cur === 0 || busy);
  document.getElementById('btnNext').disabled = (cur === TOTAL || busy);
  document.getElementById('btnCover').disabled = (cur === 0 || busy);
  document.getElementById('progress').style.width = (cur / TOTAL * 100) + '%';
}

/* Переворот страницы: лист вращается вокруг корешка справа налево */
function flip(dir) {
  if (busy) return;
  if (dir > 0 && cur >= TOTAL) return;
  if (dir < 0 && cur <= 0) return;
  busy = true;
  updateNav();

  const s = spreads[cur];
  const n = spreads[cur + dir];

  const leaf = document.createElement('div');
  leaf.className = 'leaf';
  const front = document.createElement('div');
  front.className = 'face front';
  const back = document.createElement('div');
  back.className = 'face back';

  if (dir > 0) {
    /* вперёд: лист = правая страница текущего разворота,
       под ним проявляется следующий разворот */
    front.innerHTML = s.right;
    back.innerHTML = n.left;
    halfLeft.innerHTML = s.left;
    halfRight.innerHTML = n.right;
    halfLeft.scrollTop = 0; halfRight.scrollTop = 0;
    leaf.style.transform = 'rotateY(0deg)';
    book.appendChild(leaf);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      leaf.classList.add('fwd');
      leaf.style.transform = 'rotateY(-180deg)';
    }));
  } else {
    /* назад: лист возвращается справа налево→налево,
       то есть слева лежащая страница отгибается вправо */
    front.innerHTML = n.right;
    back.innerHTML = s.left;
    halfLeft.innerHTML = n.left;
    halfRight.innerHTML = s.right;
    halfLeft.scrollTop = 0; halfRight.scrollTop = 0;
    leaf.style.transform = 'rotateY(-180deg)';
    book.appendChild(leaf);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      leaf.classList.add('bwd');
      leaf.style.transform = 'rotateY(0deg)';
    }));
  }

  /* книга раскрывается/закрывается при переходе через обложку */
  if (cur === 0) book.classList.remove('closed');
  if (cur + dir === 0) book.classList.add('closed');

  setTimeout(() => {
    leaf.remove();
    setSpread(cur + dir);
    busy = false;
    updateNav();
  }, 1000);
}

function closeBook() {
  if (busy || cur === 0) return;
  busy = true;
  updateNav();
  scene.classList.add('fading');
  setTimeout(() => {
    setSpread(0);
    scene.classList.remove('fading');
    busy = false;
    updateNav();
  }, 380);
}

/* клик по страницам */
halfRight.addEventListener('click', e => { if (!busy && cur === 0) flip(1); });
document.getElementById('scene').addEventListener('click', e => {
  if (busy) return;
  if (e.target.closest('.page-right') || e.target.closest('.cover-page')) flip(1);
  else if (e.target.closest('.page-left') && !e.target.closest('.book-block')) flip(-1);
});

/* клавиатура */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') flip(1);
  if (e.key === 'ArrowLeft') flip(-1);
});

setSpread(0);
</script>
